name: Manual or live verification
description: Track acceptance evidence that CI cannot produce.
title: "[Verification] "
labels:
  - "kind:verification"
body:
  - type: input
    id: parent
    attributes:
      label: Parent iteration
      placeholder: "#21"
    validations:
      required: true
  - type: input
    id: canonical-document
    attributes:
      label: Canonical iteration document
      placeholder: docs/iterations/016-example.md
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Verification objective
      description: Identify the acceptance criterion that automated tests cannot prove.
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Procedure
      description: Provide bounded, reproducible steps including the tested commit.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: dropdown
    id: external-service
    attributes:
      label: External service or paid request
      options:
        - Not required
        - Required and already approved
        - Required but awaiting approval
    validations:
      required: true
  - type: textarea
    id: evidence-plan
    attributes:
      label: Evidence and redaction plan
      description: State what will be retained in the iteration document and what sensitive output must be excluded.
    validations:
      required: true
  - type: checkboxes
    id: safeguards
    attributes:
      label: Safeguards
      options:
        - label: The procedure does not execute trades or write to an external financial system.
          required: true
        - label: Credentials, private data, prompts, source content, raw provider responses, and review tokens will not be published.
          required: true
  - type: textarea
    id: execution-workflow
    attributes:
      label: Codex execution workflow
      description: Follow AGENTS.md risk-based routing. Record actual selections and update evidence as phases finish.
      value: |
        Design handoff: recorded DESIGN_READY link, or pending
        Approval: approver and approval link, or pending
        Design role / model / effort: selection and rationale
        Implementation role / model / effort: selection and rationale, or pending
        Review role / model / effort: selection and rationale, or not used
        Escalations: reason and separate sequential session evidence, or none
        Architectural ambiguity: return to design_architect before remediation
        Gate: no write-capable role starts before recorded approved DESIGN_READY
    validations:
      required: true
