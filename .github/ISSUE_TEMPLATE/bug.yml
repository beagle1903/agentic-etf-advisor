name: Bug report
description: Report reproducible incorrect behavior or a failed safety boundary.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe what happened and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include commit, operating system, Python version, provider, and service versions when relevant. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add concise logs or screenshots only when useful. Public attachments are publicly accessible.
    validations:
      required: false
  - type: input
    id: related-document
    attributes:
      label: Related iteration or architecture document
      placeholder: docs/iterations/016-example.md
    validations:
      required: false
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure check
      options:
        - label: Evidence contains no credentials, `.env` values, private data, review tokens, prompts, or raw provider responses.
          required: true
  - type: textarea
    id: execution-workflow
    attributes:
      label: Codex execution workflow
      description: Classify by impact, record the capsule before edits, and keep routine work with one owner session.
      value: |
        Classification: mechanical, ordinary, consequential, high-risk/disputed, or difficult
        Owner role / model / effort: selection and rationale
        User authorization: evidence
        Design handoff: recorded DESIGN_READY capsule link, or pending
        Capsule: scope/non-goals; invariants/interfaces; JSON/state impact; acceptance and focused verification; documentation; risks/triggers
        Routine execution: one owner session from capsule through focused tests, self-review, and verification
        Consequential approval: separate design_architect handoff and coordinator approval, or not required
        Independent review: high-risk/disputed trigger and findings, or not used
        Escalations: concrete evidence and fresh separate sequential session, or none
        Gate: capsule precedes implementation edits; reviewer findings do not authorize changes
    validations:
      required: true
