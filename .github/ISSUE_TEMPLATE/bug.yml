name: Bug report
description: Report reproducible incorrect behavior or a failed safety boundary.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe what happened and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include commit, operating system, Python version, provider, and service versions when relevant. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add concise logs or screenshots only when useful. Public attachments are publicly accessible.
    validations:
      required: false
  - type: input
    id: related-document
    attributes:
      label: Related iteration or architecture document
      placeholder: docs/iterations/016-example.md
    validations:
      required: false
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure check
      options:
        - label: Evidence contains no credentials, `.env` values, private data, review tokens, prompts, or raw provider responses.
          required: true
  - type: textarea
    id: execution-workflow
    attributes:
      label: Codex working agreement
      description: Record the accountable role, authorization, scope and verification proportionately.
      value: |
        Authorized scope and non-goals:
        Observable acceptance criteria:
        Accountable owner / role / model / effort and rationale:
        Consequential design advice and coordinator approval, if applicable:
        Independent review and concrete findings, if applicable:
        Focused tests, self-review and verification:
        Material risks, limitations or follow-up:
    validations:
      required: true
