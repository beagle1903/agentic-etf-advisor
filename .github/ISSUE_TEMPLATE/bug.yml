name: Bug report
description: Report reproducible incorrect behavior or a failed safety boundary.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe what happened and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include commit, operating system, Python version, provider, and service versions when relevant. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add concise logs or screenshots only when useful. Public attachments are publicly accessible.
    validations:
      required: false
  - type: input
    id: related-document
    attributes:
      label: Related iteration or architecture document
      placeholder: docs/iterations/016-example.md
    validations:
      required: false
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure check
      options:
        - label: Evidence contains no credentials, `.env` values, private data, review tokens, prompts, or raw provider responses.
          required: true
  - type: textarea
    id: execution-workflow
    attributes:
      label: Codex execution workflow
      description: Follow AGENTS.md risk-based routing. Record actual selections and update evidence as phases finish.
      value: |
        Design handoff: recorded DESIGN_READY link, or pending
        Approval: approver and approval link, or pending
        Design role / model / effort: selection and rationale
        Implementation role / model / effort: selection and rationale, or pending
        Review role / model / effort: selection and rationale, or not used
        Escalations: reason and separate sequential session evidence, or none
        Architectural ambiguity: return to design_architect before remediation
        Gate: no write-capable role starts before recorded approved DESIGN_READY
    validations:
      required: true
