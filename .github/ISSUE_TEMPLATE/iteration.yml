name: Iteration
description: Plan and track one short, testable delivery iteration.
title: "[Iteration NNN] "
labels:
  - "kind:iteration"
body:
  - type: markdown
    attributes:
      value: |
        Use this form when promoting roadmap work into a numbered iteration. Create and link the
        canonical `docs/iterations/NNN-*.md` file before implementation begins.
  - type: input
    id: canonical-document
    attributes:
      label: Canonical iteration document
      description: Repository path to the version-controlled execution contract.
      placeholder: docs/iterations/016-example.md
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: Describe the user-visible or system-verifiable result, not implementation activity.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Summarize what is included and explicitly excluded. Keep details in the iteration document.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance summary
      description: List the observable conditions required before the parent issue can close.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: work-items
    attributes:
      label: Planned sub-issues
      description: List independently closable contract, implementation, presentation, evaluation, or verification work.
      placeholder: Create and attach sub-issues after opening this parent.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Include automated gates and any manual, live, credentialed, or paid verification.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Link blocking issues or state that none are known.
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness confirmation
      options:
        - label: The iteration number does not conflict with accepted history.
          required: true
        - label: External credentials, cost, data, and approval requirements are identified.
          required: true
        - label: The work remains educational and does not execute trades or promise returns.
          required: true
  - type: textarea
    id: execution-workflow
    attributes:
      label: Codex execution workflow
      description: Classify by impact, record the capsule before edits, and keep routine work with one owner session.
      value: |
        Classification: mechanical, ordinary, consequential, high-risk/disputed, or difficult
        Owner role / model / effort: selection and rationale
        User authorization: evidence
        Design handoff: recorded DESIGN_READY capsule link, or pending
        Capsule: scope/non-goals; invariants/interfaces; JSON/state impact; acceptance and focused verification; documentation; risks/triggers
        Routine execution: one owner session from capsule through focused tests, self-review, and verification
        Consequential approval: separate design_architect handoff and coordinator approval, or not required
        Independent review: high-risk/disputed trigger and findings, or not used
        Escalations: concrete evidence and fresh separate sequential session, or none
        Finite ticket lifetime: ledger docs/workflow/tickets/issue-N.json; default 120 active minutes
        Frozen acceptance/invariant IDs: complete definitions plus capsule ID/generation/SHA256 before implementation
        Content binding: review, verification, acceptance and original delivery PR share one digest
        Lifetime reservations: initial review 1; remediation 1; final review 1; design reset 1
        Consequential design challenge: separate independent session before coordinator approval
        Explicit finite user extensions: none, or named authorization and finite deltas
        Split lineage: validated predecessor, inherited counters and allocated remainder, or none
        Stop: BLOCKED_FOR_DECISION on exhaustion, failed final review or unresolved serious blocker
        Gate: capsule precedes implementation edits; reviewer findings do not authorize changes
    validations:
      required: true
