name: Iteration work item
description: Track one independently reviewable development, design, evaluation, or presentation outcome.
title: "[Work] "
labels:
  - "kind:work-item"
body:
  - type: input
    id: parent
    attributes:
      label: Parent iteration
      description: Link the parent issue.
      placeholder: "#21"
    validations:
      required: true
  - type: input
    id: canonical-document
    attributes:
      label: Canonical iteration document
      placeholder: docs/iterations/016-example.md
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the independently observable result this issue delivers.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List focused tests and any required manual evidence.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blockers with GitHub relationships after submission, or state that there are none.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety boundary
      options:
        - label: Graph state remains JSON-serializable and side effects stay behind explicit interfaces.
          required: true
        - label: No credentials, private data, trade execution, or guaranteed-return claims are introduced.
          required: true
  - type: textarea
    id: execution-workflow
    attributes:
      label: Codex execution workflow
      description: Classify by impact, record the capsule before edits, and keep routine work with one owner session.
      value: |
        Classification: mechanical, ordinary, consequential, high-risk/disputed, or difficult
        Owner role / model / effort: selection and rationale
        User authorization: evidence
        Design handoff: recorded DESIGN_READY capsule link, or pending
        Capsule: scope/non-goals; invariants/interfaces; JSON/state impact; acceptance and focused verification; documentation; risks/triggers
        Routine execution: one owner session from capsule through focused tests, self-review, and verification
        Consequential approval: separate design_architect handoff and coordinator approval, or not required
        Independent review: high-risk/disputed trigger and findings, or not used
        Escalations: concrete evidence and fresh separate sequential session, or none
        Gate: capsule precedes implementation edits; reviewer findings do not authorize changes
    validations:
      required: true
